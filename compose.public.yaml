# Optional HTTPS access for WebRTC and Telegram callbacks.
# docker compose -f compose.yaml -f compose.public.yaml up -d --build
services:
  api:
    environment:
      TUNNEL_METRICS_URL: http://tunnel:20241/metrics
  tunnel:
    image: docker.io/cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:20241", "--url", "http://frontend:3000"]
    depends_on:
      frontend:
        condition: service_healthy
