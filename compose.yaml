services:
  api:
    restart: unless-stopped
    build:
      context: ./api
    environment:
      PORT: 4000
      DATABASE_PATH: /data/business.sqlite
      AGENT_URL: http://agents:8000
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_ALLOWED_CHAT_IDS: ${TELEGRAM_ALLOWED_CHAT_IDS:-}
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      JEV_API_KEY: ${JEV_API_KEY:-}
      TYPESAFE_MODEL: ${TYPESAFE_MODEL:-jev-1.14.0}
      SUPPLIER_MAX_PREMIUM_PERCENT: ${SUPPLIER_MAX_PREMIUM_PERCENT:-5}
      WHATSAPP_API_URL: http://evolution:8080
      WHATSAPP_API_KEY: ${WHATSAPP_API_KEY:-}
      WHATSAPP_INSTANCE_NAME: ${WHATSAPP_INSTANCE_NAME:-nexo}
      WHATSAPP_TEST_SUPPLIER_NUMBER: ${WHATSAPP_TEST_SUPPLIER_NUMBER:-}
      WHATSAPP_SUPPLIER_NUMBER: ${WHATSAPP_SUPPLIER_NUMBER:-}
      WHATSAPP_TELEGRAM_FALLBACK_SECONDS: ${WHATSAPP_TELEGRAM_FALLBACK_SECONDS:-60}
      WHATSAPP_WEBHOOK_SECRET: ${WHATSAPP_WEBHOOK_SECRET:-}
      VOICE_WEBHOOK_SECRET: ${VOICE_WEBHOOK_SECRET:-}
      JWT_SECRET: ${JWT_SECRET:-nexo-dev-jwt-secret-change-in-production}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    volumes: [business-data:/data]
    ports: ["127.0.0.1:4000:4000"]
    depends_on: [agents]
  agents:
    restart: unless-stopped
    build:
      context: ./backend
    environment:
      AGENT_DATABASE_PATH: /data/checkpoints.sqlite
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      TELEGRAM_ALLOWED_CHAT_IDS: ${TELEGRAM_ALLOWED_CHAT_IDS:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-20}
      TAVILY_EXTRACT_TIMEOUT_SECONDS: ${TAVILY_EXTRACT_TIMEOUT_SECONDS:-45}
      TAVILY_EXTRACT_MAX_URLS_PER_TASK: ${TAVILY_EXTRACT_MAX_URLS_PER_TASK:-10}
      TAVILY_EXTRACT_MAX_CREDITS_PER_TASK: ${TAVILY_EXTRACT_MAX_CREDITS_PER_TASK:-10}
      TAVILY_EXTRACT_MAX_RETRIES: ${TAVILY_EXTRACT_MAX_RETRIES:-2}
      TAVILY_EXTRACT_CONCURRENCY: ${TAVILY_EXTRACT_CONCURRENCY:-2}
      REPUTATION_REFRESH_TOTAL_BUDGET_SECONDS: ${REPUTATION_REFRESH_TOTAL_BUDGET_SECONDS:-30}
      REPUTATION_REFRESH_MAX_DOMAINS: ${REPUTATION_REFRESH_MAX_DOMAINS:-10}
      REPUTATION_REFRESH_DOMAIN_TIMEOUT_SECONDS: ${REPUTATION_REFRESH_DOMAIN_TIMEOUT_SECONDS:-20}
      REPUTATION_REFRESH_SEARCH_TIMEOUT_SECONDS: ${REPUTATION_REFRESH_SEARCH_TIMEOUT_SECONDS:-8}
      REPUTATION_REFRESH_CONCURRENCY: ${REPUTATION_REFRESH_CONCURRENCY:-10}
      NEST_API_URL: http://api:4000
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      VOICE_WEBHOOK_SECRET: ${VOICE_WEBHOOK_SECRET:-}
      VAPI_API_KEY: ${VAPI_API_KEY:-}
      VAPI_ASSISTANT_ID: ${VAPI_ASSISTANT_ID:-}
      VAPI_PHONE_NUMBER_ID: ${VAPI_PHONE_NUMBER_ID:-}
      VAPI_WEBHOOK_URL: ${VAPI_WEBHOOK_URL:-}
    volumes: [agent-data:/data]
    expose: ["8000"]
  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
    environment:
      API_URL: http://api:4000
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      JWT_SECRET: ${JWT_SECRET:-nexo-dev-jwt-secret-change-in-production}
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]
  # Evolution keeps its own infrastructure; the business API continues using SQLite.
  evolution:
    image: localhost/nexo-evolution:2.3.7-pairing-1
    build:
      context: ./infrastructure/evolution
    restart: unless-stopped
    ports: ["127.0.0.1:8080:8080"]
    environment:
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: http://localhost:8080
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${WHATSAPP_API_KEY:-}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "false"
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_DB_PASSWORD:-evolution-local}@evolution-db:5432/evolution?schema=public
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379/0
      CACHE_REDIS_PREFIX_KEY: nexo-evolution
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "false"
      TELEMETRY_ENABLED: "false"
    volumes: [evolution-instances:/evolution/instances]
    depends_on:
      evolution-db:
        condition: service_healthy
      evolution-redis:
        condition: service_healthy
  evolution-db:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD:-evolution-local}
      POSTGRES_DB: evolution
    volumes: [evolution-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 5s
      timeout: 5s
      retries: 10
  evolution-redis:
    image: docker.io/library/redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [evolution-redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  evolution-instances:
  evolution-db:
  evolution-redis:
  business-data:
  agent-data:
